name: Employee Management CI-CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ============================================
  # TEST
  # ============================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          PYTHONPATH: backend
          JWT_SECRET: github-actions-test-secret
        run: |
          python -m pytest backend/tests -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm install

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm run build


  # ============================================
  # SECURITY SCAN
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"


  # ============================================
  # VERSIONED ARTIFACT
  # ============================================
  artifact:
    name: Create Versioned Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Release ZIP
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"

          if [[ "$VERSION" == "main" ]]; then
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi

          mkdir -p release

          zip -r "release/employee-management-${VERSION}.zip" \
            backend \
            frontend \
            k8s \
            .github \
            docker-compose.yml \
            README.md \
            VERSION \
            .gitignore

      - name: Upload Versioned Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-management-${{ github.run_number }}
          path: release/*.zip


  # ============================================
  # DOCKER
  # ============================================
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - test
      - security

    steps:

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert GitHub Username to Lowercase
        id: repo
        shell: bash
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/employee-management-backend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/employee-management-backend:latest

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/employee-management-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/employee-management-frontend:latest
