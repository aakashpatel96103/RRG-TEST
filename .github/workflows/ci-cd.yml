name: Employee Management CI-CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  # ==========================================
  # 1. TEST
  # ==========================================
  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run backend tests
        env:
          PYTHONPATH: backend
          JWT_SECRET: github-actions-test-secret
        run: |
          python -m pytest backend/tests -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build


  # ==========================================
  # 2. SECURITY
  # ==========================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Trivy filesystem security scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"


  # ==========================================
  # 3. VERSIONED ARTIFACT
  # ==========================================
  artifact:
    name: Create Versioned Artifact
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Create artifact
        run: |
          VERSION="${GITHUB_REF_NAME}"

          if [[ "$VERSION" == "main" || "$VERSION" == "HEAD" ]]; then
            VERSION="1.0.${GITHUB_RUN_NUMBER}"
          fi

          mkdir -p release

          zip -r "release/employee-management-${VERSION}.zip" \
            backend \
            frontend \
            k8s \
            .github \
            docker-compose.yml \
            README.md \
            VERSION \
            .gitignore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-management-${{ github.run_number }}
          path: release/*.zip


  # ==========================================
  # 4. DOCKER
  # ==========================================
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs:
      - test
      - security

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convert repository owner to lowercase
        id: repo
        run: |
          echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/employee-management-backend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/employee-management-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/employee-management-frontend:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.owner }}/employee-management-frontend:latest
