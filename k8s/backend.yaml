apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-backend
  namespace: employee-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: employee-backend}
  template:
    metadata:
      labels: {app: employee-backend}
    spec:
      containers:
      - name: backend
        image: ghcr.io/aakashpatel96103/RRG-TEST.git:latest
        ports: [{containerPort: 8000}]
        env:
        - name: JWT_SECRET
          valueFrom: {secretKeyRef: {name: employee-secret, key: JWT_SECRET}}
        readinessProbe:
          httpGet: {path: /ready, port: 8000}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: employee-backend
  namespace: employee-system
spec:
  selector: {app: employee-backend}
  ports: [{port: 8000, targetPort: 8000}]
