apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-frontend
  namespace: employee-system
spec:
  replicas: 2
  selector:
    matchLabels: {app: employee-frontend}
  template:
    metadata:
      labels: {app: employee-frontend}
    spec:
      containers:
      - name: frontend
        image: ghcr.io/aakashpatel96103/RRG-TEST.git:latest
        ports: [{containerPort: 80}]
        readinessProbe:
          httpGet: {path: /, port: 80}
          initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: employee-frontend
  namespace: employee-system
spec:
  type: NodePort
  selector: {app: employee-frontend}
  ports: [{port: 80, targetPort: 80}]
